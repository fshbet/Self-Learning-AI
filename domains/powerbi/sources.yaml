# Seed source catalog for the Power BI domain (§7, §8).
# authority: 0-100 (official documentation ≈ 95, recognised expert sources ≈ 85, community ≈ 50)
# source_class: who stands behind the source — official (vendor / standards body) | external (reputable third
# party) | community (forums, blogs, Q&A) | organization (internal). It is provenance, never derived from
# authority: an expert third party can be highly authoritative and still not official.
# permissions record what we believe the terms allow; verify before enabling "train"/"redistribute".
sources:
  - key: ms-learn-dax
    name: Microsoft Learn — DAX reference
    url: https://learn.microsoft.com/en-us/dax/dax-function-reference
    publisher: Microsoft
    source_type: web
    authority: 95
    source_class: official
    license: CC BY 4.0 (Microsoft Learn docs)
    permissions: {read: true, store: true, process: true, train: false, redistribute: false}
    crawl_frequency_hours: 168
    max_depth: 2
    max_pages: 80
    allow_patterns: ["learn\\.microsoft\\.com/en-us/dax/"]
    deny_patterns: ["\\?", "/dax/[a-z]{2}-[a-z]{2}/"]

